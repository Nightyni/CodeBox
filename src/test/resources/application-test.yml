spring:
  datasource:
    url: jdbc:h2:mem:codebox;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

codebox:
  llm:
    # Tests must never depend on a live model.
    enabled: false
    api-key: ""

logging:
  level:
    com.codebox: DEBUG
